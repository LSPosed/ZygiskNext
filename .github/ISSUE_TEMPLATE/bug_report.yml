name: Bug report / 反馈 Bug
description: Report errors or unexpected behavior. / 反馈错误或异常行为。
labels: [bug]
title: "[Bug] Short description / 简单描述"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting issues for Zygisk Next!
        To make it easier for us to help you please enter detailed information below.
        Note: We will **NEVER** handle any issue related to root detection or writable system.
        If you encounter the `Function not Implemented (38)` error during installation, [please refer to here](https://github.com/Dr-TSNG/ZygiskNext/issues/219)
        **Bug reports that contain only AI analysis or self-speculated results without original logs will be considered invalid.**

        感谢给 Zygisk Next 汇报问题！
        为了使我们更好地帮助你，请提供以下信息。
        为了防止重复汇报，标题请务必使用英文。
        请注意：我们**不会**处理任何有关 root 检测和 system 分区可写相关的问题。
        如您在安装时遇到了 `Function not Implemented (38)` 错误，[请参考此处](https://github.com/Dr-TSNG/ZygiskNext/issues/219)。
        **提交的错误报告不应该只包含 AI 分析或自行揣测的结果而不含原始日志，这些错误报告会被视作无效报告**。
  - type: textarea
    attributes:
      label: Steps to reproduce/复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour/预期行为
      placeholder: Tell us what should happen/正常情况下应该发生什么
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behaviour / 实际行为
      placeholder: Tell us what happens instead / 实际上发生了什么
    validations:
      required: true
  - type: textarea
    attributes:
      label: Module List / 模块列表
      description: Include Magisk, Xposed and other Modules (if any) / 包含 Magisk, Xposed 和其他模块（如有）
      render: Shell
    validations:
      required: true
  - type: input
    attributes:
      label: Zygisk Next version / Zygisk Next 版本
      description: Don't use 'latest'. Specify actual version, otherwise your issue will be closed./不要填用“最新版”。给出具体版本号，不然 issue 会被关闭。
    validations:
      required: true
  - type: input
    attributes:
      label: Android version / Android 版本
    validations:
      required: true
  - type: input
    attributes:
      label: Kernel version / 内核版本
    validations:
      required: true
  - type: input
    attributes:
      label: OS Version / 系统版本
    validations:
      required: true
  - type: input
    attributes:
      label: Phone model / 手机型号
    validations:
      required: true
  - type: input
    attributes:
      label: Magisk/KernelSU/APatch Root method type + version / Magisk/KernelSU/APatch Root 方式类型 + 版本
    validations:
      required: true
  - type: checkboxes
    id: latest
    attributes:
      label: Version requirement / 版本要求
      options:
        - label: I am using latest version of Zygisk Next/我正在使用最新版本 Zygisk Next
          required: true
  - type: textarea
    attributes:
      label: Logs/日志
      description: For usage issues, please provide the bugreport or log saved from **Zygisk Next's action or 'Send bugreport' in WebUI** / KernelSU / APatch manager (For magisk user, please **DO NOT** provide magisk logs), or catch logs with [log catcher module](https://t.me/hwrtools/10) or [tool](https://t.me/hwrtools/12). Without logs zip, the issue will be closed. /使用问题请提供从 **Zygisk Next 的 action 或 WebUI 的「发送 bugreport」** / KernelSU / APatch 管理器保存的 Bugreport 或日志（Magisk 用户请**不要**提供 Magisk 日志），或者使用[日志抓取模块](https://t.me/hwrtools/10)或[工具](https://t.me/hwrtools/12)获取日志。没有日志附件的问题会被关闭。
      placeholder: Upload logs zip by clicking the bar on the bottom. Upload logs to other websites or using external links is prohibited. /点击文本框底栏上传日志压缩包，禁止上传到其它网站或使用外链提供日志。
    validations:
      required: true
